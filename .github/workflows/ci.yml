name: CI Workflow

on:
  push:
    branches: [ "main", "master"]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:latest
        env:
          MYSQL_DB: traceWallet
          MYSQL_USER: postgres
          MYSQL_PASSWORD: mysqlpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd sql_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv pip install --system -r pyproject.toml

      - name: Run Tests
        env:
          DB_NAME: quickpay
          DB_USER: mysql
          DB_PASSWORD: mysqlpassword
          DB_HOST: localhost
          DB_PORT: 3306
          SECRET_KEY: test_secret_key
        run: python manage.py test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/quickpay:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/quickpay:${{ github.run_id }}-${{ github.run_number }}